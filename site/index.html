<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every government job, admit card, answer key and result in one calm list.">
<title>SarkariChart</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400&display=swap">
<style>
/* Layout: nav line, one ruled table, footer. Nothing else. One typeface, one size, two inks. */
:root {
  --page: #FFFFFF;
  --ink: #1D1C1B;
  --grey: #76726B;
  --line: #E5E1D8;
  --soft: #F4F1EB;
  --hover: #FAF8F4;
  --calm: #3E6B4E; --calm-bg: #EEF4EE;
  --warm: #9A5410; --warm-bg: #FBF0E2;
  --hot: #B23A1A; --hot-bg: #FCEBE5;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, "Segoe UI", Roboto, "Kohinoor Devanagari", "Nirmala UI", "Noto Sans Devanagari", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #1C1B1A; --ink: #ECEAE4; --grey: #A29E96; --line: #34322E; --soft: #262522; --hover: #222120; --calm: #9CC7A8; --calm-bg: #1F2A22; --warm: #E7B27A; --warm-bg: #33281C; --hot: #F09A80; --hot-bg: #3A221C; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #1C1B1A; --ink: #ECEAE4; --grey: #A29E96; --line: #34322E; --soft: #262522; --hover: #222120; --calm: #9CC7A8; --calm-bg: #1F2A22; --warm: #E7B27A; --warm-bg: #33281C; --hot: #F09A80; --hot-bg: #3A221C; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* tags: one small framed shape used for days left, the K shortcut and the chosen category */
.tag { white-space: nowrap; font-variant-numeric: tabular-nums; }
.gap { display: inline-block; width: 14px; }
.newline { margin: -24px 0 12px; color: var(--hot); }
/* "New" badge on the 3 most recent notices: a soft breathing dot, not a hard blink */
.new { display: inline-flex; align-items: center; margin-right: 8px; color: var(--hot); vertical-align: 2px; }
.new::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .new::before { animation: none; } }
.dd { display: inline-block; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.tag.calm { color: var(--calm); }
.tag.warm { color: var(--warm); }
.tag.hot { color: var(--hot); }

body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: 1rem; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
.sheet { max-width: 1000px; margin: 0 auto; padding-block: 14px 48px; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
ul, p { margin: 0; padding: 0; list-style: none; }
.g { color: var(--grey); }
.show-sm { display: none; }
.num { font-variant-numeric: tabular-nums; }

.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-bottom: 6px; }
.top .logo { display: block; line-height: 0; }
.top .logo img { width: 112px; height: 112px; display: block; }
.top .logo:hover { text-decoration: none; }
.nav-r { display: flex; justify-content: flex-end; gap: 18px; }
.top button { all: unset; cursor: pointer; }
.top button:hover { text-decoration: underline; text-underline-offset: 3px; }

.row { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 5.75rem 6.25rem 9rem 4.25rem; gap: 0 16px; align-items: baseline; }
main { margin-top: 36px; flex: 1; }
.head { color: var(--grey); background: var(--soft); padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 28%, var(--page)); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 14px; }
.search { display: block; margin-bottom: 40px; }
.search input { all: unset; box-sizing: border-box; width: 100%; padding: 6px 0; border-bottom: 1px solid var(--line); }
.search input::placeholder { color: var(--grey); }
.search input:focus { border-bottom-color: var(--ink); }
.tabs button { all: unset; cursor: pointer; color: var(--grey); transition: color .25s ease; }
.list { transition: opacity .18s ease; }
.list.fade { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .list, .tabs button { transition: none; } }
.tabs button[aria-pressed="true"] { color: var(--ink); }
.tabs button:hover { color: var(--ink); }
.tabs .c { margin-left: 5px; font-variant-numeric: tabular-nums; }
.tabs .c:empty { display: none; }
.tabs button.zero { opacity: .45; }
.empty { padding: 5px 8px; color: var(--grey); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.list li + li { border-top: 1px solid var(--line); }
.list li:last-child { border-bottom: 1px solid var(--line); }
.list li.lr { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 5.75rem 6.25rem 9rem 4.25rem; gap: 0 16px; align-items: baseline; padding: 5px 8px; }
.list li.lr > a.row { display: contents; }
.list .t { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list li.lr:hover, .list li.lr.sel { background: var(--hover); }
.list li.lr.sel .t, .list li.lr:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.list .pdf { color: var(--ink); white-space: nowrap; }
.list .pdf:hover { text-decoration: underline; text-underline-offset: 3px; }
.list .pdf { display: inline-flex; align-items: center; gap: 5px; align-self: center; }
.list .pdf svg { flex: none; }
.list a.row:hover { text-decoration: none; }
.list a.row:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.right { text-align: right; }

footer { margin: 64px auto 0; display: grid; gap: 4px; max-width: 34rem; text-align: center; justify-items: center; }


/* inline search: plain grey words at the right, never boxes */
.search { position: relative; }
.search input { padding-right: 60px; padding-left: 28px; }
.sicon { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--grey); pointer-events: none; }
.search:focus-within .sicon { color: var(--ink); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.sx { position: absolute; right: 0; top: 50%; transform: translateY(-50%); all: unset; position: absolute; right: 0; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--grey); }
.sx:hover { color: var(--ink); }
.recent { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: -30px 0 22px; }
.recent button { all: unset; cursor: pointer; color: var(--ink); }
.recent button:hover { text-decoration: underline; text-underline-offset: 3px; }



@media (max-width: 640px) {
  .top { grid-template-columns: 1fr auto 1fr; }
  .top > .g { font-size: 0.875rem; }
  .top .logo img { width: 88px; height: 88px; }
  .hide-sm { display: none; }
  .list .pdf.hide-sm { display: none; }
  .show-sm { display: inline; }
  .row, .list li.lr { grid-template-columns: minmax(0, 1fr) 5.5rem; }
}
</style>
</head>
<body>


<div class="sheet">
  <header class="top">
    <span class="g" data-t="tagline">Govt jobs, exams, results</span>
    <a class="logo" href="/" data-t-aria="home"><img src="/logo-256.png" width="112" height="112" alt="SarkariChart" data-t-alt="brand"></a>
    <span class="nav-r"><a href="#" data-t="about">About</a><button type="button" id="lang" lang="hi">हिंदी</button></span>
  </header>

  <main>
    <div class="tabs" role="group" data-t-aria="show">
      <button type="button" data-cat="all" aria-pressed="true"><span data-t="all">All</span><span class="c"></span></button>
      <button type="button" data-cat="Job" aria-pressed="false"><span data-t="jobs">Jobs</span><span class="c"></span></button>
      <button type="button" data-cat="Admit card" aria-pressed="false"><span data-t="admits">Admit cards</span><span class="c"></span></button>
      <button type="button" data-cat="Result" aria-pressed="false"><span data-t="results">Results</span><span class="c"></span></button>
      <button type="button" data-cat="Answer key" aria-pressed="false"><span data-t="keys">Answer keys</span><span class="c"></span></button>
    </div>
    <label class="search" for="q"><span style="position:absolute;left:-9999px" data-t="searchLabel">Search notices</span>
      <svg class="sicon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4 20.5 20.5"/></svg>
      <input id="q" type="search" placeholder="Search: SSC, UGC NET, 12th pass, Bihar…" autocomplete="off" data-t-ph="searchPh">
      <button type="button" class="sx" id="kHint" hidden data-t="clear">Clear</button>
    </label>
    <div class="recent" id="recent" hidden></div>
    <p class="newline" id="newline" hidden></p>
    <div class="row head"><span class="hide-sm" data-t="hPosted">Posted</span><span data-t="hNotice">Notice</span><span class="hide-sm" data-t="hOrg">Organisation</span><span class="hide-sm" data-t="hType">Type</span><span data-t="hLast">Last date / status</span><span class="hide-sm" data-t="hPdf">PDF</span></div>
    <ul class="list" id="list"></ul>
  </main>

  <footer>
    <p class="g" data-t="disclaimer">SarkariChart is not a government website. If anything here differs from the official notice, the official notice is correct.</p>
    <p><a href="#" data-t="about">About</a> · <a href="#" data-t="report">Report a mistake</a> · <a href="#" data-t="privacy">Privacy</a></p>
  </footer>
</div>

<script>
(() => {
  // ---------- language ----------
  const T = {
    en: {
      title: "SarkariChart", brand: "SarkariChart", home: "SarkariChart home", tagline: "Govt jobs, exams, results", about: "About", show: "Show",
      all: "All", jobs: "Jobs", admits: "Admit cards", results: "Results", keys: "Answer keys",
      searchLabel: "Search notices", recentLabel: "Recent:", searchPh: "Search: SSC, UGC NET, 12th pass, Bihar…", clear: "Clear",
      hPosted: "Posted", hNotice: "Notice", hOrg: "Organisation", hType: "Type", hLast: "Last date / status", hPdf: "PDF",
      disclaimer: "SarkariChart is not a government website. If anything here differs from the official notice, the official notice is correct.",
      report: "Report a mistake", privacy: "Privacy", switchTo: "हिंदी", switchLang: "hi",
      Job: "Job", Result: "Result", "Answer key": "Answer key", "Admit card": "Admit card",
      available: "Available", newBadge: "New", sinceLast: n => `${n} new since your last visit`, inNotice: "In notice", lastDay: "Last day", pdfAria: "Download this notice as PDF",
      daysLeft: d => `${d} day${d === 1 ? "" : "s"} left`, daysShort: d => `${d} day${d === 1 ? "" : "s"}`,
      none: q => `Nothing matches "${q}". Try a shorter word, like an organisation name.`,
      empty: "Nothing here right now. New notices appear as soon as they are published.",
      locale: "en-IN",
    },
    hi: {
      title: "सरकारी चार्ट", brand: "सरकारी चार्ट", home: "सरकारी चार्ट मुखपृष्ठ", tagline: "सरकारी नौकरी, परीक्षा, रिज़ल्ट", about: "हमारे बारे में", show: "दिखाएँ",
      all: "सभी", jobs: "नौकरियाँ", admits: "एडमिट कार्ड", results: "रिज़ल्ट", keys: "आंसर की",
      searchLabel: "सूचनाएँ खोजें", recentLabel: "हाल की खोजें:", searchPh: "खोजें: एसएससी, यूजीसी नेट, 12वीं पास, बिहार…", clear: "हटाएँ",
      hPosted: "जारी", hNotice: "सूचना", hOrg: "संस्था", hType: "प्रकार", hLast: "अंतिम तिथि / स्थिति", hPdf: "पीडीएफ",
      disclaimer: "सरकारी चार्ट कोई सरकारी वेबसाइट नहीं है। यहाँ दी गई कोई जानकारी आधिकारिक सूचना से अलग हो, तो आधिकारिक सूचना को ही सही मानें।",
      report: "गलती बताएँ", privacy: "गोपनीयता", switchTo: "अंग्रेज़ी", switchLang: "en",
      Job: "नौकरी", Result: "रिज़ल्ट", "Answer key": "आंसर की", "Admit card": "एडमिट कार्ड",
      available: "उपलब्ध", newBadge: "नया", sinceLast: n => `पिछली बार के बाद ${n} नई सूचनाएँ`, inNotice: "सूचना में देखें", lastDay: "आज अंतिम दिन", pdfAria: "यह सूचना पीडीएफ में डाउनलोड करें",
      daysLeft: d => `${d} दिन बाकी`, daysShort: d => `${d} दिन`,
      none: q => `“${q}” से कुछ नहीं मिला। छोटा शब्द आज़माएँ, जैसे संस्था का नाम।`,
      empty: "अभी यहाँ कुछ नहीं है। नई सूचनाएँ जारी होते ही यहाँ दिखेंगी।",
      locale: "hi-IN",
    },
  };
  const ORG_HI = { NTA: "एनटीए", SSC: "एसएससी", UPPSC: "यूपीपीएससी", BPSC: "बीपीएससी" };
  let lang = "en";
  try { if (localStorage.getItem("sc-lang") === "hi") lang = "hi"; } catch (e) {}
  const t = k => T[lang][k];

  // Sample entries from the watcher's test runs (Oct 2026). Only extracted values; not verified.
  const TODAY = new Date();
  // posted = date on the official notice where known, otherwise the day we found it.
  const ITEMS = [
    { type: "Job", title: "UGC NET December 2026", hi: "यूजीसी नेट दिसंबर 2026", org: "NTA", posted: "2026-10-08", publishedAt: "2026-10-21T19:50:00Z", last: "2026-10-28", url: "/notice/ugc-net-december-2026/", page: true },
    { type: "Job", title: "SWAYAM exam, online application", hi: "स्वयं परीक्षा, ऑनलाइन आवेदन", org: "NTA", posted: "2026-10-09", publishedAt: "2026-10-21T19:50:00Z", last: "2026-11-01", url: "https://nta.ac.in" },
    { type: "Job", title: "NIFT Entrance Exam 2027", hi: "निफ्ट प्रवेश परीक्षा 2027", org: "NTA", posted: "2026-10-16", publishedAt: "2026-10-21T19:50:00Z", last: "2026-11-16", url: "https://nta.ac.in" },
    { type: "Job", title: "Junior Engineer Examination 2026", hi: "जूनियर इंजीनियर परीक्षा 2026", org: "SSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", last: null, url: "https://ssc.gov.in" },
    { type: "Job", title: "Lecturer, Textile Technology", hi: "प्रवक्ता, वस्त्र प्रौद्योगिकी", org: "UPPSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", last: null, url: "https://uppsc.up.nic.in" },
    { type: "Answer key", title: "Selection Posts Phase XIV, response sheets", hi: "सेलेक्शन पोस्ट फेज़ 14, उत्तर पत्रक", org: "SSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", url: "https://ssc.gov.in" },
    { type: "Result", title: "Constable (GD) in CAPFs, SSF and Rifleman (GD)", hi: "सीएपीएफ, एसएसएफ में कांस्टेबल (जीडी) और राइफलमैन (जीडी)", org: "SSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", url: "https://ssc.gov.in" },
    { type: "Result", title: "Combined Higher Secondary (10+2) Level Exam 2025", hi: "संयुक्त उच्चतर माध्यमिक (10+2) स्तर परीक्षा 2025", org: "SSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", url: "https://ssc.gov.in" },
    { type: "Admit card", title: "Stenographer (आशुलिपिक), exam start date", hi: "आशुलिपिक, परीक्षा आरंभ तिथि", org: "BPSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", url: "https://bpsc.bihar.gov.in" },
    { type: "Result", title: "Assistant Teacher, Advt. A-5/E-1/2025", hi: "सहायक अध्यापक, विज्ञापन ए-5/ई-1/2025", org: "UPPSC", posted: "2026-10-21", publishedAt: "2026-10-21T19:50:00Z", url: "https://uppsc.up.nic.in" },
  ];
  // ---------- "New" = new since YOUR last visit ----------
  // A visit ends after 30 minutes away. Within one visit (reloads, new tabs) the badges stay put;
  // on the next visit, only notices published after the previous one are marked.
  // First-time visitors: notices from the last 24 hours, at most the 5 most recent.
  // Backfilled/catch-up notices (quiet: true) are never marked new.
  const VISIT_GAP = 30 * 60 * 1000, FIRST_WINDOW = 24 * 3600 * 1000, FIRST_CAP = 5;
  const pubTime = i => Date.parse(i.publishedAt || (i.posted + "T00:00:00+05:30"));
  let since = null, firstVisit = true;
  try {
    const v = JSON.parse(localStorage.getItem("sc-visit") || "null");
    const now = Date.now();
    if (v && v.lastSeen) {
      if (now - v.lastSeen > VISIT_GAP) { firstVisit = false; since = v.lastSeen; }   // a new visit
      else { firstVisit = !!v.first; since = v.since ?? null; }                       // same visit: keep what was shown
    }
    const save = () => { try { localStorage.setItem("sc-visit", JSON.stringify({ lastSeen: Date.now(), since, first: firstVisit })); } catch (e) {} };
    save();
    setInterval(() => { if (!document.hidden) save(); }, 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) save(); });
  } catch (e) { /* no storage: behave like a first visit */ }
  const FIRST_NEW = [...ITEMS].filter(i => !i.quiet && Date.now() - pubTime(i) < FIRST_WINDOW)
    .sort((a, b) => pubTime(b) - pubTime(a)).slice(0, FIRST_CAP);
  const isNew = i => !i.quiet && (firstVisit ? FIRST_NEW.includes(i) : pubTime(i) > since);
  const title = i => lang === "hi" ? i.hi : i.title;
  const org = i => lang === "hi" ? (ORG_HI[i.org] || i.org) : i.org;
  const fmtText = iso => new Date(iso + "T00:00:00").toLocaleDateString(t("locale"), { day: "numeric", month: "short" });
  // Dates line up: the day number sits in a fixed 2-digit slot, so the months form a straight column.
  const fmt = iso => {
    const d = new Date(iso + "T00:00:00");
    const day = d.getDate();
    const mon = d.toLocaleDateString(t("locale"), { month: "short" });
    return `<span class="dd">${day}</span> ${mon}`;
  };
  const left = iso => Math.ceil((new Date(iso + "T23:59:59") - TODAY) / 864e5);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // days-left text: calm when there is time, warm under a week, hot in the last 3 days
  function daysTag(iso, short) {
    const d = left(iso);
    const cls = d <= 3 ? "hot" : d <= 7 ? "warm" : "calm";
    const txt = d === 0 ? t("lastDay") : short ? t("daysShort")(d) : t("daysLeft")(d);
    return `<span class="tag ${cls}">${txt}</span>`;
  }
  function lastCell(i) {
    if (i.type !== "Job") return t("available");
    if (!i.last) return t("inNotice");
    // No "days left" text in the list: the date itself turns warm in the last week and red-orange in the last 3 days.
    const d = left(i.last);
    const cls = d <= 3 ? "tag hot" : d <= 7 ? "tag warm" : "";
    return `<span class="${cls}" title="${d === 0 ? t("lastDay") : t("daysLeft")(d)}">${fmt(i.last)}</span>`;
  }
  let cat = "all", q = "";
  // search matches English and Hindi words alike, whichever language is showing
  const words = i => [i.title, i.hi, i.org, ORG_HI[i.org] || "", i.type, T.hi[i.type], i.tags || ""].join(" ").toLowerCase();

  // How people actually type: abbreviations, nicknames and Hindi spellings point to the same notices.
  const SYN = [
    ["railway", "rrb", "रेलवे", "rail"], ["bank", "ibps", "sbi", "बैंक"],
    ["police", "constable", "capf", "पुलिस", "कांस्टेबल", "sipahi", "सिपाही"],
    ["10th", "matric", "matriculation", "10वीं", "हाईस्कूल", "high school"],
    ["12th", "10+2", "intermediate", "inter", "12वीं", "इंटर", "higher secondary", "उच्चतर माध्यमिक"],
    ["teacher", "अध्यापक", "शिक्षक", "lecturer", "प्रवक्ता", "professor", "प्रोफ़ेसर"],
    ["cgl", "combined graduate level"], ["chsl", "combined higher secondary"],
    ["steno", "stenographer", "आशुलिपिक"], ["je", "junior engineer", "जूनियर इंजीनियर", "engineer", "इंजीनियर"],
    ["net", "ugc net", "नेट", "यूजीसी"], ["gd", "general duty", "जीडी"],
    ["result", "results", "रिज़ल्ट", "रिजल्ट", "परिणाम", "merit", "selected", "चयनित"],
    ["admit", "admit card", "hall ticket", "एडमिट", "प्रवेश पत्र"],
    ["answer key", "answer", "key", "आंसर", "उत्तर कुंजी", "response sheet", "उत्तर पत्रक"],
    ["job", "jobs", "vacancy", "bharti", "भर्ती", "नौकरी", "recruitment"],
    ["ssc", "एसएससी", "staff selection"], ["nta", "एनटीए"], ["uppsc", "यूपीपीएससी"], ["bpsc", "बीपीएससी", "bihar", "बिहार"],
    ["up", "uttar pradesh", "उत्तर प्रदेश", "uppsc"],
  ];
  const expand = w => {
    const out = new Set([w]);
    for (const g of SYN) if (g.some(x => x === w || (w.length >= 3 && x.startsWith(w)))) g.forEach(x => out.add(x));
    return [...out];
  };
  // Typos: allow 1 wrong letter in words of 4–6 letters, 2 in longer words.
  function near(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return false;
    const prev = Array.from({ length: b.length + 1 }, (_, k) => k);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        rowMin = Math.min(rowMin, cur[j]);
      }
      if (rowMin > max) return false;
      prev.splice(0, prev.length, ...cur);
    }
    return prev[b.length] <= max;
  }
  const tokens = i => words(i).split(/[^\p{L}\p{N}+]+/u).filter(Boolean);
  function wordHit(i, w) {
    const text = words(i);
    if (expand(w).some(x => text.includes(x))) return 2;          // exact or synonym
    const max = w.length >= 7 ? 2 : w.length >= 4 ? 1 : 0;
    if (max && tokens(i).some(tk => near(w, tk, max) || (tk.length > w.length && near(w, tk.slice(0, w.length), max)))) return 1;   // typo
    return 0;
  }
  const qwords = () => q.split(/\s+/).filter(Boolean);
  const qmatch = i => qwords().every(w => wordHit(i, w) > 0);
  // Most useful first while searching: open jobs (closing soonest), admit cards, answer keys, results.
  const TYPE_RANK = { "Job": 0, "Admit card": 2, "Answer key": 3, "Result": 4 };
  const searchRank = i => (i.type === "Job" && !i.last ? 1 : TYPE_RANK[i.type] ?? 5);
  const titleScore = i => { const tt = (i.title + " " + i.hi).toLowerCase(); return qwords().reduce((n, w) => n + (tt.startsWith(w) ? 3 : tt.includes(w) ? 2 : 0), 0); };
  const live = i => !i.last || left(i.last) >= 0;
  function setCat(c) {
    cat = c;
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat === c)));
  }
  // If the search finds nothing in the chosen category but finds it elsewhere, move to where it is.
  function followSearch() {
    if (!q || cat === "all") return;
    const hits = ITEMS.filter(i => live(i) && qmatch(i));
    if (!hits.length || hits.some(i => i.type === cat)) return;
    const types = [...new Set(hits.map(i => i.type))];
    setCat(types.length === 1 ? types[0] : "all");
  }
  // PDF = a printable copy of OUR notice page (made automatically when the site is published), in the language being viewed.
  const pdfOf = i => i.page ? `${i.url}sarkarichart-${i.url.split("/").filter(Boolean).pop()}-${lang}.pdf` : "";
  // generic PDF file icon (red outlined page, folded corner)
  const PDFICON = '<svg class="pdfi" width="19" height="23" viewBox="0 0 34 41" aria-hidden="true"><path d="M3 3h19.5L31 11.5V38H3z" fill="#F6F4F1" stroke="#E2231A" stroke-width="3" stroke-linejoin="round"/><path d="M22.5 3v8.5H31" fill="none" stroke="#E2231A" stroke-width="3" stroke-linejoin="round"/><text x="17" y="31.5" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2B2B2B">PDF</text></svg>';
  const DL = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>';
  function render() {
    // Jobs: closing soonest first (undated last). Everything else: newest first.
    const byClosing = (a, b) => (!a.last) - (!b.last) || (a.last || "").localeCompare(b.last || "") || b.posted.localeCompare(a.posted);
    const byNewest = (a, b) => b.posted.localeCompare(a.posted);
    const bySearch = (a, b) => searchRank(a) - searchRank(b) || titleScore(b) - titleScore(a) || (a.last || "9").localeCompare(b.last || "9") || b.posted.localeCompare(a.posted);
    const rows = [...ITEMS].sort(q ? bySearch : cat === "Job" ? byClosing : byNewest).filter(i => live(i) && (cat === "all" || i.type === cat) && qmatch(i));
    const hits = ITEMS.filter(i => live(i) && (!q || qmatch(i)));
    document.querySelectorAll(".tabs button").forEach(b => {
      const n = b.dataset.cat === "all" ? hits.length : hits.filter(i => i.type === b.dataset.cat).length;
      b.querySelector(".c").textContent = q ? n : "";
      b.classList.toggle("zero", !!q && n === 0);
    });
    const nl = document.getElementById("newline"), nNew = ITEMS.filter(i => live(i) && isNew(i)).length;
    nl.hidden = firstVisit || !nNew; nl.textContent = nNew ? t("sinceLast")(nNew) : "";
    document.getElementById("list").innerHTML = rows.map(i =>
      `<li class="lr"><a class="row" href="${i.url}"${i.page ? "" : ' target="_blank" rel="noopener"'}><span class="num hide-sm">${fmt(i.posted)}</span><span class="t" title="${esc(title(i))}">${isNew(i) ? `<span class="new" title="${t("newBadge")}" aria-label="${t("newBadge")}"></span>` : ""}${esc(title(i))}</span><span class="hide-sm g">${org(i)}</span><span class="hide-sm g">${t(i.type)}</span><span class="num" style="white-space:nowrap">${lastCell(i)}</span></a>${pdfOf(i) ? `<a class="pdf hide-sm" href="${pdfOf(i)}" download aria-label="${t("pdfAria")}: ${esc(title(i))}">${DL}${PDFICON}</a>` : '<span class="pdf hide-sm g">—</span>'}</li>`
    ).join("") || `<li class="empty">${q ? esc(t("none")(q)) : t("empty")}</li>`;
  }
  // Keyboard: ↓ / ↑ move through the results while searching, Enter opens the highlighted one.
  let sel = -1;
  function rowsEls() { return [...document.querySelectorAll("#list li.lr")]; }
  function markSel() {
    rowsEls().forEach((li, k) => { li.classList.toggle("sel", k === sel); li.setAttribute("aria-selected", String(k === sel)); });
    const el = rowsEls()[sel];
    if (el) el.scrollIntoView({ block: "nearest" });
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
    document.querySelectorAll("[data-t-ph]").forEach(el => el.placeholder = t(el.dataset.tPh));
    document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.tAria)));
    document.querySelectorAll("[data-t-alt]").forEach(el => el.alt = t(el.dataset.tAlt));
    const btn = document.getElementById("lang");
    btn.textContent = t("switchTo"); btn.lang = t("switchLang");
    render();
  }
  const list = document.getElementById("list");
  function update() {
    list.classList.add("fade");
    requestAnimationFrame(() => { render(); requestAnimationFrame(() => list.classList.remove("fade")); });
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { setCat(b.dataset.cat); update(); }));
  // Shareable searches: ?q=ssc+gd opens with the search filled in; the address follows what you type.
  let urlTimer, recentTimer;
  function syncUrl() {
    clearTimeout(urlTimer);
    urlTimer = setTimeout(() => {
      try {
        const u = new URL(location.href);
        if (q) u.searchParams.set("q", document.getElementById("q").value.trim()); else u.searchParams.delete("q");
        history.replaceState(null, "", u);
      } catch (e) {}
    }, 400);
  }
  // Recent searches (this device only): saved once a search has results and you pause or open one.
  const RECENT_KEY = "sc-recent";
  const getRecent = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch (e) { return []; } };
  function saveRecent(text) {
    text = (text || "").trim();
    if (text.length < 2) return;
    const list = [text, ...getRecent().filter(x => x.toLowerCase() !== text.toLowerCase())].slice(0, 3);
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
  }
  const recentEl = document.getElementById("recent");
  function showRecent() {
    const r = getRecent();
    const qv = document.getElementById("q").value;
    recentEl.hidden = !!qv || !r.length || document.activeElement !== document.getElementById("q");
    recentEl.innerHTML = `<span class="g">${t("recentLabel")}</span>` + r.map(x => `<button type="button" data-r="${esc(x)}">${esc(x)}</button>`).join("");
  }
  recentEl.addEventListener("mousedown", e => {
    const b = e.target.closest("[data-r]");
    if (!b) return;
    e.preventDefault();
    const qi = document.getElementById("q");
    qi.value = b.dataset.r; qi.dispatchEvent(new Event("input")); qi.focus();
  });
  document.getElementById("q").addEventListener("focus", showRecent);
  document.getElementById("q").addEventListener("blur", () => setTimeout(showRecent, 0));
  list.addEventListener("click", e => { if (q && e.target.closest("a")) saveRecent(document.getElementById("q").value); });

  document.getElementById("q").addEventListener("input", e => {
    q = e.target.value.trim().toLowerCase();
    sel = -1;
    const before = cat;
    followSearch();
    if (cat !== before) update(); else render();
    syncUrl(); showRecent();
    clearTimeout(recentTimer);
    if (q) recentTimer = setTimeout(() => { if (ITEMS.some(i => live(i) && qmatch(i))) saveRecent(e.target.value); }, 1500);
  });
  try {
    const startQ = new URL(location.href).searchParams.get("q");
    if (startQ) { const qi = document.getElementById("q"); qi.value = startQ; q = startQ.trim().toLowerCase(); }
  } catch (e) {}
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "hi" ? "en" : "hi";
    try { localStorage.setItem("sc-lang", lang); } catch (e) {}
    applyLang();
  });
  applyLang();

  // "Clear" appears only while there is text in the search line.
  const kHint = document.getElementById("kHint"), qIn = document.getElementById("q");
  const syncHint = () => { kHint.hidden = !qIn.value; };
  kHint.addEventListener("click", e => { e.preventDefault(); qIn.value = ""; qIn.dispatchEvent(new Event("input")); qIn.focus(); });
  qIn.addEventListener("input", syncHint);
  syncHint();

  // Start typing anywhere and the letters go straight into the search line.
  document.addEventListener("keydown", e => {
    const el = document.activeElement;
    const inField = el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
    if (inField) {
      if (el === qIn) {
        const n = rowsEls().length;
        if (e.key === "ArrowDown" && n) { e.preventDefault(); sel = Math.min(sel + 1, n - 1); markSel(); }
        else if (e.key === "ArrowUp" && n) { e.preventDefault(); sel = Math.max(sel - 1, 0); markSel(); }
        else if (e.key === "Enter" && n) {
          e.preventDefault();
          const row = rowsEls()[sel < 0 ? 0 : sel].querySelector("a.row");
          saveRecent(qIn.value);
          if (row) row.click();
        }
        else if (e.key === "Escape") { qIn.value = ""; qIn.dispatchEvent(new Event("input")); qIn.blur(); }
      }
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1 || e.key === " ") return;
    qIn.focus();   // the key press then lands in the search line
  });
})();
</script>
