<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every government job, admit card, answer key and result in one calm list.">
<title>SarkariChart</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400&display=swap">
<style>
/* Layout: nav line, one ruled table, footer. Nothing else. One typeface, one size, two inks. */
:root {
  --page: #FFFFFF;
  --ink: #1D1C1B;
  --grey: #9C9890;
  --line: #E5E1D8;
  --soft: #F4F1EB;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, "Segoe UI", Roboto, "Kohinoor Devanagari", "Nirmala UI", "Noto Sans Devanagari", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #1C1B1A; --ink: #ECEAE4; --grey: #8E8A82; --line: #34322E; --soft: #262522; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #1C1B1A; --ink: #ECEAE4; --grey: #8E8A82; --line: #34322E; --soft: #262522; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: 1rem; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
.sheet { max-width: 980px; margin: 0 auto; padding-block: 14px 48px; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
ul, p { margin: 0; padding: 0; list-style: none; }
.g { color: var(--grey); }
.num { font-variant-numeric: tabular-nums; }

.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-bottom: 6px; }
.top .logo { display: block; line-height: 0; }
.top .logo img { width: 112px; height: 112px; display: block; }
.top .logo:hover { text-decoration: none; }
.nav-r { display: flex; justify-content: flex-end; gap: 18px; }
.top button { all: unset; cursor: pointer; }
.top button:hover { text-decoration: underline; text-underline-offset: 3px; }

.row { display: grid; grid-template-columns: 5rem 1fr 7rem 6.5rem 5.5rem; gap: 0 16px; align-items: baseline; }
main { margin-top: 36px; flex: 1; }
.head { color: var(--grey); padding-bottom: 4px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-bottom: 14px; }
.search { display: block; margin-bottom: 32px; }
.search input { all: unset; box-sizing: border-box; width: 100%; padding: 6px 0; border-bottom: 1px solid var(--line); }
.search input::placeholder { color: var(--grey); }
.search input:focus { border-bottom-color: var(--ink); }
.tabs button { all: unset; cursor: pointer; color: var(--grey); transition: color .25s ease; }
.list { transition: opacity .18s ease; }
.list.fade { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .list, .tabs button { transition: none; } }
.tabs button[aria-pressed="true"] { color: var(--ink); }
.tabs button:hover { color: var(--ink); }
.tabs .c { margin-left: 5px; font-variant-numeric: tabular-nums; }
.tabs .c:empty { display: none; }
.tabs button.zero { opacity: .45; }
.empty { padding: 4px 0; color: var(--grey); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.list li { border-top: 1px solid var(--line); }
.list li:last-child { border-bottom: 1px solid var(--line); }
.list a.row { padding: 4px 0; }
.list a.row:hover { text-decoration: none; background: var(--soft); }
.right { text-align: right; }

footer { margin: 64px auto 0; display: grid; gap: 4px; max-width: 34rem; text-align: center; justify-items: center; }


/* inline search: plain grey words at the right, never boxes */
.search { position: relative; }
.search input { padding-right: 90px; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.sx { position: absolute; right: 0; top: 50%; transform: translateY(-50%); all: unset; position: absolute; right: 0; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--grey); }
.sx:hover { color: var(--ink); }

/* search pop-up: same sheet as the page. Square, hairlines, no shadow, no tint. */
.pal-back { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--page) 88%, transparent); display: flex; justify-content: center; align-items: flex-start;
  padding: calc(env(safe-area-inset-top, 0px) + 10vh) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); opacity: 0; transition: opacity .14s linear; }
.pal-back.on { opacity: 1; }
.pal { width: 100%; max-width: 640px; max-height: 72vh; display: flex; flex-direction: column; background: var(--page); border: 1px solid var(--ink); }
.pal-top { display: flex; align-items: baseline; gap: 16px; padding: 10px 14px; border-bottom: 1px solid var(--ink); }
.pal-top input { all: unset; flex: 1; min-width: 0; }
.pal-top input::placeholder { color: var(--grey); }
.pal-top button { all: unset; cursor: pointer; color: var(--grey); }
.pal-top button:hover { color: var(--ink); }
.pal-body { overflow-y: auto; }
.pal-group { padding: 14px 14px 4px; color: var(--grey); }
.pal-item { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 4px 14px; color: var(--ink); text-decoration: none; cursor: pointer; border-top: 1px solid var(--line); }
.pal-item .s { color: var(--grey); white-space: nowrap; }
.pal-item:hover, .pal-item[aria-selected="true"] { background: var(--soft); text-decoration: none; }
.pal-item mark { background: none; color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.pal-try { padding: 12px 14px 4px; color: var(--grey); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.pal-try button { all: unset; cursor: pointer; color: var(--ink); }
.pal-try button:hover { text-decoration: underline; text-underline-offset: 3px; }
.pal-empty { padding: 12px 14px; color: var(--grey); }
.pal-foot { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--grey); margin-top: 10px; }
@media (hover: none) { .pal-foot { display: none; } }
@media (max-width: 640px) { .pal-item { grid-template-columns: 1fr; gap: 0; } .pal-item .s { white-space: normal; } }
@media (prefers-reduced-motion: reduce) { .pal-back { transition: none; } }

@media (max-width: 640px) {
  .top { grid-template-columns: 1fr auto 1fr; }
  .top > .g { font-size: 0.875rem; }
  .top .logo img { width: 88px; height: 88px; }
  .hide-sm { display: none; }
  .row { grid-template-columns: 1fr 4.5rem; }
}
</style>
</head>
<body>


<div class="sheet">
  <header class="top">
    <span class="g">Govt jobs, exams, results</span>
    <a class="logo" href="/" aria-label="SarkariChart home"><img src="/logo-256.png" width="112" height="112" alt="SarkariChart"></a>
    <span class="nav-r"><a href="#">About</a><button type="button" id="lang">हिंदी</button></span>
  </header>

  <main>
    <div class="tabs" role="group" aria-label="Show">
      <button type="button" data-cat="all" aria-pressed="true">All<span class="c"></span></button>
      <button type="button" data-cat="Job" aria-pressed="false">Jobs<span class="c"></span></button>
      <button type="button" data-cat="Admit card" aria-pressed="false">Admit cards<span class="c"></span></button>
      <button type="button" data-cat="Result" aria-pressed="false">Results<span class="c"></span></button>
      <button type="button" data-cat="Answer key" aria-pressed="false">Answer keys<span class="c"></span></button>
    </div>
    <label class="search" for="q"><span style="position:absolute;left:-9999px">Search notices</span>
      <input id="q" type="search" placeholder="Search: SSC, UGC NET, 12th pass, Bihar…" autocomplete="off" data-en-ph="Search: SSC, UGC NET, 12th pass, Bihar…" data-hi-ph="खोजें: SSC, UGC NET, 12वीं पास, बिहार…">
          <button type="button" class="sx" id="kHint" aria-label="Open quick search">Press K</button>
    </label>
    <div class="row head"><span class="hide-sm">Posted</span><span data-en="Notice" data-hi="सूचना">Notice</span><span class="hide-sm">Organisation</span><span class="hide-sm">Type</span><span>Last date</span></div>
    <ul class="list" id="list"></ul>
  </main>

  <footer>
    <p class="g">SarkariChart is not a government website. If anything here differs from the official notice, the official notice is correct.</p>
    <p><a href="#">About</a> · <a href="#">Report a mistake</a> · <a href="#">Privacy</a></p>
  </footer>
</div>


<div class="pal-back" id="palBack" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Search">
    <div class="pal-top">
      <input id="pq" type="text" placeholder="Search jobs, results, admit cards…" autocomplete="off" aria-controls="palList" aria-label="Search">
      <button type="button" id="palClear">Clear</button>
    </div>
    <div class="pal-body" id="palList" role="listbox"></div>
    <div class="pal-foot">↑ ↓ move · ↵ open · esc close</div>
  </div>
</div>

<script>
(() => {
  // Sample entries from the watcher's test runs (Oct 2026). Only extracted values; not verified.
  const TODAY = new Date();
  // posted = date on the official notice where known, otherwise the day we found it.
  const ITEMS = [
    { type: "Job", title: "UGC NET December 2026", org: "NTA", posted: "2026-10-08", last: "2026-10-28", url: "https://nta.ac.in" },
    { type: "Job", title: "SWAYAM exam, online application", org: "NTA", posted: "2026-10-09", last: "2026-11-01", url: "https://nta.ac.in" },
    { type: "Job", title: "NIFT Entrance Exam 2027", org: "NTA", posted: "2026-10-16", last: "2026-11-16", url: "https://nta.ac.in" },
    { type: "Job", title: "Junior Engineer Examination 2026", org: "SSC", posted: "2026-10-21", last: null, url: "https://ssc.gov.in" },
    { type: "Job", title: "Lecturer, Textile Technology", org: "UPPSC", posted: "2026-10-21", last: null, url: "https://uppsc.up.nic.in" },
    { type: "Answer key", title: "Selection Posts Phase XIV, response sheets", org: "SSC", posted: "2026-10-21", url: "https://ssc.gov.in" },
    { type: "Result", title: "Constable (GD) in CAPFs, SSF and Rifleman (GD)", org: "SSC", posted: "2026-10-21", url: "https://ssc.gov.in" },
    { type: "Result", title: "Combined Higher Secondary (10+2) Level Exam 2025", org: "SSC", posted: "2026-10-21", url: "https://ssc.gov.in" },
    { type: "Admit card", title: "Stenographer (आशुलिपिक), exam start date", org: "BPSC", posted: "2026-10-21", url: "https://bpsc.bihar.gov.in" },
    { type: "Result", title: "Assistant Teacher, Advt. A-5/E-1/2025", org: "UPPSC", posted: "2026-10-21", url: "https://uppsc.up.nic.in" },
  ];
  const fmt = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const left = iso => Math.ceil((new Date(iso + "T23:59:59") - TODAY) / 864e5);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let cat = "all", q = "";
  const words = i => [i.title, i.org, i.type].join(" ").toLowerCase();
  const qmatch = i => q.split(/\s+/).every(w => words(i).includes(w));
  const live = i => !i.last || left(i.last) >= 0;
  function setCat(c) {
    cat = c;
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.cat === c)));
  }
  // If the search finds nothing in the chosen category but finds it elsewhere, move to where it is.
  function followSearch() {
    if (!q || cat === "all") return;
    const hits = ITEMS.filter(i => live(i) && qmatch(i));
    if (!hits.length || hits.some(i => i.type === cat)) return;
    const types = [...new Set(hits.map(i => i.type))];
    setCat(types.length === 1 ? types[0] : "all");
  }
  function render() {
    const rows = [...ITEMS].sort((a, b) => b.posted.localeCompare(a.posted)).filter(i => (!i.last || left(i.last) >= 0) && (cat === "all" || i.type === cat) && q.split(/\s+/).every(w => words(i).includes(w)));
    // match counts per category while searching
    const hits = ITEMS.filter(i => (!i.last || left(i.last) >= 0) && (!q || qmatch(i)));
    document.querySelectorAll(".tabs button").forEach(b => {
      const n = b.dataset.cat === "all" ? hits.length : hits.filter(i => i.type === b.dataset.cat).length;
      b.querySelector(".c").textContent = q ? n : "";
      b.classList.toggle("zero", !!q && n === 0);
    });
    document.getElementById("list").innerHTML = rows.map(i =>
      `<li><a class="row" href="${i.url}" target="_blank" rel="noopener"><span class="num hide-sm">${fmt(i.posted)}</span><span class="t">${esc(i.title)}</span><span class="hide-sm g">${i.org}</span><span class="hide-sm g">${i.type}</span><span class="num">${i.last ? fmt(i.last) : "—"}</span></a></li>`
    ).join("") || (q ? `<li class="empty">Nothing matches "${esc(q)}". Try a shorter word, like an organisation name.</li>` : '<li class="empty">Nothing here right now. New notices appear as soon as they are published.</li>');
  }
  const list = document.getElementById("list");
  function update() {
    list.classList.add("fade");
    requestAnimationFrame(() => { render(); requestAnimationFrame(() => list.classList.remove("fade")); });
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { setCat(b.dataset.cat); update(); }));
  document.getElementById("q").addEventListener("input", e => {
    q = e.target.value.trim().toLowerCase();
    const before = cat;
    followSearch();
    if (cat !== before) update(); else render();
  });
  render();

  let hi = false;
  document.getElementById("lang").addEventListener("click", e => {
    hi = !hi;
    document.querySelectorAll("[data-en]").forEach(el => el.textContent = hi ? el.dataset.hi : el.dataset.en);
    const qi = document.getElementById("q"); qi.placeholder = hi ? qi.dataset.hiPh : qi.dataset.enPh;
    e.currentTarget.textContent = hi ? "English" : "हिंदी";
    document.documentElement.lang = hi ? "hi" : "en";
  });

  // ---------- search pop-up (press K) ----------
  const back = document.getElementById("palBack"), pq = document.getElementById("pq"), plist = document.getElementById("palList");
  const GROUPS = [["Job", "Jobs"], ["Result", "Results"], ["Answer key", "Answer keys"], ["Admit card", "Admit cards"]];
  let sel = 0, flat = [];
  const hl = (text, terms) => {
    let out = esc(text);
    terms.forEach(t => { if (t) out = out.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
    return out;
  };
  // Relevance first (title start > title word > title > organisation/type), then most recent.
  function score(i, terms) {
    const t = i.title.toLowerCase(), o = (i.org + " " + i.type).toLowerCase();
    let s = 0;
    for (const w of terms) {
      const ty = i.type.toLowerCase(), og = i.org.toLowerCase();
      if (og === w || ty.startsWith(w)) s += 7;          // exact organisation or category ("ssc", "result")
      else if (t.startsWith(w)) s += 6;
      else if (new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).test(t)) s += 4;
      else if (t.includes(w)) s += 2;
      else if (o.includes(w)) s += 3;
      else return -1;
    }
    return s;
  }
  const meta = i => [i.org, i.type, i.last ? (left(i.last) >= 0 ? "till " + fmt(i.last) : "closed") : fmt(i.posted)].filter(Boolean).join(" · ");
  function palRender() {
    const raw = pq.value.trim().toLowerCase(), terms = raw.split(/\s+/).filter(Boolean);
    let html = "";
    flat = [];
    if (!terms.length) {
      const recent = [...ITEMS].sort((a, b) => b.posted.localeCompare(a.posted)).slice(0, 6);
      html += '<div class="pal-try">Try <button type="button" data-try="SSC">SSC</button><button type="button" data-try="result">result</button><button type="button" data-try="UGC NET">UGC NET</button><button type="button" data-try="teacher">teacher</button></div>';
      html += '<div class="pal-group">Recent</div>';
      recent.forEach(i => { flat.push(i); html += `<a class="pal-item" role="option" data-k="${flat.length - 1}" href="${i.url}" target="_blank" rel="noopener">${esc(i.title)}<span class="s">${esc(meta(i))}</span></a>`; });
    } else {
      const scored = ITEMS.map(i => ({ i, s: score(i, terms) })).filter(x => x.s >= 0)
        .sort((a, b) => b.s - a.s || b.i.posted.localeCompare(a.i.posted));
      // groups ordered by their best match
      const order = [...new Set(scored.map(x => x.i.type))];
      order.forEach(type => {
        const label = (GROUPS.find(g => g[0] === type) || [type, type])[1];
        html += `<div class="pal-group">${label}</div>`;
        scored.filter(x => x.i.type === type).slice(0, 6).forEach(({ i }) => {
          flat.push(i);
          html += `<a class="pal-item" role="option" data-k="${flat.length - 1}" href="${i.url}" target="_blank" rel="noopener">${hl(i.title, terms)}<span class="s">${hl(meta(i), terms)}</span></a>`;
        });
      });
      if (!flat.length) html = `<div class="pal-empty">Nothing found for “${esc(raw)}”. Try an organisation like SSC, or a word like result.</div>`;
    }
    plist.innerHTML = html;
    sel = 0; mark();
  }
  function mark() {
    plist.querySelectorAll(".pal-item").forEach(el => {
      const on = Number(el.dataset.k) === sel;
      el.setAttribute("aria-selected", String(on));
      if (on) el.scrollIntoView({ block: "nearest" });
    });
  }
  function openPal(prefill) {
    back.hidden = false;
    pq.value = prefill ?? document.getElementById("q").value;
    palRender();
    requestAnimationFrame(() => { back.classList.add("on"); pq.focus(); pq.select(); });
  }
  function closePal() {
    back.classList.remove("on");
    setTimeout(() => { back.hidden = true; }, 160);
  }
  pq.addEventListener("input", palRender);
  document.getElementById("palClear").addEventListener("click", () => { pq.value = ""; palRender(); pq.focus(); });
  plist.addEventListener("click", e => {
    const t = e.target.closest("[data-try]");
    if (t) { pq.value = t.dataset.try; palRender(); pq.focus(); }
  });
  plist.addEventListener("mousemove", e => { const it = e.target.closest(".pal-item"); if (it && Number(it.dataset.k) !== sel) { sel = Number(it.dataset.k); mark(); } });
  back.addEventListener("click", e => { if (e.target === back) closePal(); });
  pq.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); if (flat.length) { sel = (sel + 1) % flat.length; mark(); } }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (flat.length) { sel = (sel - 1 + flat.length) % flat.length; mark(); } }
    else if (e.key === "Enter") { const el = plist.querySelector(`.pal-item[data-k="${sel}"]`); if (el) { e.preventDefault(); el.click(); } }
    else if (e.key === "Escape") { e.preventDefault(); closePal(); }
  });
  document.addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "") || document.activeElement?.isContentEditable;
    const isK = e.key === "k" || e.key === "K";
    if (isK && (e.metaKey || e.ctrlKey)) { e.preventDefault(); back.hidden ? openPal("") : closePal(); return; }
    if (isK && !typing && !e.altKey && back.hidden) { e.preventDefault(); openPal(""); }
    if (e.key === "Escape" && !back.hidden) closePal();
  });
  const kHint = document.getElementById("kHint"), qIn = document.getElementById("q");
  const syncHint = () => { kHint.textContent = qIn.value ? "Clear" : (matchMedia("(hover: none)").matches ? "" : "Press K"); };
  kHint.addEventListener("click", e => {
    e.preventDefault();
    if (qIn.value) { qIn.value = ""; qIn.dispatchEvent(new Event("input")); qIn.focus(); } else openPal("");
  });
  qIn.addEventListener("input", syncHint);
  syncHint();
})();
</script>

</body>
</html>
