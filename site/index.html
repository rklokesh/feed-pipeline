<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Every government job, admit card, answer key and result in one calm list.">
<title>SarkariChart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400&display=swap">
<style>
/* Layout: nav line, one ruled table, footer. Nothing else. One typeface, one size, two inks. */
:root {
  --page: #FFFFFF;
  --ink: #1D1C1B;
  --grey: #9C9890;
  --line: #E5E1D8;
  --soft: #F4F1EB;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, -apple-system, "Segoe UI", Roboto, "Kohinoor Devanagari", "Nirmala UI", "Noto Sans Devanagari", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #1C1B1A; --ink: #ECEAE4; --grey: #8E8A82; --line: #34322E; --soft: #262522; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #1C1B1A; --ink: #ECEAE4; --grey: #8E8A82; --line: #34322E; --soft: #262522; color-scheme: dark; }

* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--font); font-size: 1rem; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
.sheet { max-width: 980px; margin: 0 auto; padding-block: 14px 48px; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
ul, p { margin: 0; padding: 0; list-style: none; }
.g { color: var(--grey); }
.num { font-variant-numeric: tabular-nums; }

.top { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 16px; padding-bottom: 6px; }
.top button { all: unset; cursor: pointer; }
.top button:hover { text-decoration: underline; text-underline-offset: 3px; }

.row { display: grid; grid-template-columns: 7.5rem 1fr 8rem 7rem 1.25rem; gap: 0 16px; align-items: baseline; }
main { margin-top: 56px; flex: 1; }
.head { color: var(--grey); padding-bottom: 4px; }
.list li { border-top: 1px solid var(--line); }
.list li:last-child { border-bottom: 1px solid var(--line); }
.list a.row { padding: 4px 0; }
.list a.row:hover { text-decoration: none; background: var(--soft); }
.list a.row:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.right { text-align: right; }

footer { margin-top: 64px; display: grid; gap: 4px; max-width: 34rem; }

@media (max-width: 640px) {
  .top { grid-template-columns: 1fr auto; }
  .hide-sm { display: none; }
  .row { grid-template-columns: 5.4rem 1fr 1rem; }
}
</style>
</head>
<body>


<div class="sheet">
  <header class="top">
    <a href="#">SarkariChart</a>
    <span class="hide-sm g">Govt jobs, exams, results</span>
    <a class="hide-sm" href="#">About</a>
    <button type="button" id="lang">हिंदी</button>
  </header>

  <main>
    <div class="row head"><span>Date</span><span data-en="Notice" data-hi="सूचना">Notice</span><span class="hide-sm">Organisation</span><span class="hide-sm right">Type</span><span></span></div>
    <ul class="list" id="list"></ul>
  </main>

  <footer>
    <p class="g">SarkariChart is not a government website. If anything here differs from the official notice, the official notice is correct.</p>
    <p><a href="#">About</a> · <a href="#">Report a mistake</a> · <a href="#">Privacy</a></p>
  </footer>
</div>

<script>
(() => {
  // Sample entries from the watcher's test runs (Oct 2026). Only extracted values; not verified.
  const TODAY = new Date();
  const ITEMS = [
    { kind: "job", type: "Job", title: "UGC NET December 2026", org: "NTA", last: "2026-10-28", url: "https://nta.ac.in" },
    { kind: "job", type: "Job", title: "SWAYAM exam, online application", org: "NTA", last: "2026-11-01", url: "https://nta.ac.in" },
    { kind: "job", type: "Job", title: "NIFT Entrance Exam 2027", org: "NTA", last: "2026-11-16", url: "https://nta.ac.in" },
    { kind: "job", type: "Job · 1,699 posts", title: "Junior Engineer Examination 2026", org: "SSC", last: null, url: "https://ssc.gov.in" },
    { kind: "job", type: "Job · 1 post", title: "Lecturer, Textile Technology", org: "UPPSC", last: null, url: "https://uppsc.up.nic.in" },
    { kind: "up", type: "Answer key", title: "Selection Posts Phase XIV, response sheets", org: "SSC", seen: "2026-10-21", url: "https://ssc.gov.in" },
    { kind: "up", type: "Result", title: "Constable (GD) in CAPFs, SSF and Rifleman (GD)", org: "SSC", seen: "2026-10-21", url: "https://ssc.gov.in" },
    { kind: "up", type: "Result", title: "Combined Higher Secondary (10+2) Level Exam 2025", org: "SSC", seen: "2026-10-21", url: "https://ssc.gov.in" },
    { kind: "up", type: "Admit card", title: "Stenographer (आशुलिपिक), exam start date", org: "BPSC", seen: "2026-10-21", url: "https://bpsc.bihar.gov.in" },
    { kind: "up", type: "Result", title: "Assistant Teacher, Advt. A-5/E-1/2025", org: "UPPSC", seen: "2026-10-21", url: "https://uppsc.up.nic.in" },
  ];
  const fmt = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const left = iso => Math.ceil((new Date(iso + "T23:59:59") - TODAY) / 864e5);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const date = i => i.kind === "job"
    ? (i.last ? `${fmt(i.last)}<span class="g"> · ${left(i.last)}d left</span>` : '<span class="g">See notice</span>')
    : `<span class="g">${fmt(i.seen)}</span>`;

  const rows = ITEMS.filter(i => i.kind !== "job" || !i.last || left(i.last) >= 0);
  document.getElementById("list").innerHTML = rows.map(i =>
    `<li><a class="row" href="${i.url}" target="_blank" rel="noopener"><span class="num">${date(i)}</span><span class="t">${esc(i.title)}</span><span class="hide-sm g">${i.org}</span><span class="hide-sm right g">${i.type}</span><span class="right">→</span></a></li>`
  ).join("");

  let hi = false;
  document.getElementById("lang").addEventListener("click", e => {
    hi = !hi;
    document.querySelectorAll("[data-en]").forEach(el => el.textContent = hi ? el.dataset.hi : el.dataset.en);
    e.currentTarget.textContent = hi ? "English" : "हिंदी";
    document.documentElement.lang = hi ? "hi" : "en";
  });
})();
</script>

</body>
</html>
