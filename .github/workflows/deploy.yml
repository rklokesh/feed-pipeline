name: Deploy site

# Publishes site/ to Cloudflare Pages (sarkarichart.pages.dev).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create Pages project (first run only)
        run: npx --yes wrangler@3 pages project create sarkarichart --production-branch main || echo "project exists"
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy site --project-name sarkarichart --branch main --commit-dirty=true
