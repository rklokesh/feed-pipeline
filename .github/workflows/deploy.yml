name: Deploy site

# Builds PDF copies of every notice page, then publishes site/ to Cloudflare Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "functions/**", "wrangler.toml", "scripts/make_pdfs.mjs", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:      # publish.yml calls this right after you approve a notice

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always deploy the newest commit (includes just-published notices)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # PDFs only change when a notice page, the PDF script or the logo changes.
      # They are cached under that fingerprint, so homepage-only edits skip the slow browser install.
      - name: Restore notice PDFs
        id: pdfcache
        uses: actions/cache@v4
        with:
          path: site/notice/**/*.pdf
          key: pdfs-${{ hashFiles('site/notice/**/*.html', 'scripts/make_pdfs.mjs', 'site/logo*.png') }}
      - name: Install PDF printer
        if: steps.pdfcache.outputs.cache-hit != 'true'
        timeout-minutes: 8          # a stuck apt mirror must never block the site deploy
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core >/dev/null || true
      - name: Make PDFs of notice pages (English + Hindi)
        if: steps.pdfcache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        continue-on-error: true
        run: node scripts/make_pdfs.mjs site
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy site --project-name sarkarichart --branch main --commit-dirty=true
