name: Deploy site

# Builds PDF copies of every notice page, then publishes site/ to Cloudflare Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/make_pdfs.mjs", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PDF printer
        run: |
          npm i --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core >/dev/null || true
      - name: Make PDFs of notice pages (English + Hindi)
        run: node scripts/make_pdfs.mjs site
      - name: Create Pages project (first run only)
        run: npx --yes wrangler@3 pages project create sarkarichart --production-branch main || echo "project exists"
      - name: Deploy
        run: npx --yes wrangler@3 pages deploy site --project-name sarkarichart --branch main --commit-dirty=true
