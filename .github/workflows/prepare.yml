name: Prepare notices for review

# After each watch run: AI turns new raw notices into clean cards and publishes them (a closed issue is kept as the record).
on:
  workflow_run:
    workflows: ["Watch official sources", "Watch India-only sources"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # save cards into data/
  issues: write     # open review issues

concurrency:
  group: data-writes
  cancel-in-progress: false

env:
  # when the first model's free daily allowance runs out, the next one (its own free allowance) takes over
  GEMINI_MODELS: "gemini-flash-lite-latest,gemini-flash-latest,gemini-2.0-flash"

jobs:
  prepare:
    # GitHub's runners (free now the repo is public): keeps the Mac free for checking boards every 30 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      published: ${{ steps.cards.outputs.published }}
      site: ${{ steps.save.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: runner.os != 'macOS'
      - name: Use the Mac's Python (set up by the India watcher)
        if: runner.os == 'macOS'
        run: echo "$HOME/.sarkarichart-venv/bin" >> "$GITHUB_PATH"
      - name: Prepare cards and auto-publish
        id: cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/prepare.py
      - name: Write notice pages (new ones + a few older pages upgraded to the full layout each run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/retype.py && python scripts/exams.py tag && python scripts/hubs.py tag && python scripts/pages.py && python scripts/elig.py && python scripts/exams.py build && python scripts/verify.py --act
      - name: Rebuild homepage list
        run: python scripts/publish.py build && python scripts/hubs.py build && python scripts/seo_pages.py && python scripts/report_page.py && python scripts/info_pages.py && python scripts/seo_files.py
      - name: Save
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site reports
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Prepare: cards + auto-publish $(date -u +%Y-%m-%dT%H:%MZ)"
          if git diff --name-only HEAD~1 | grep -q '^site/'; then echo "site=1" >> "$GITHUB_OUTPUT"; fi
          ok=0
          for i in 1 2 3; do
            # site/ is rebuilt every run, so on a clash our freshly built copy wins (-X theirs = the commit being replayed);
            # the next run rebuilds it from everything that was merged
            if git pull --rebase -X theirs -q >push.log 2>&1 && git push -q >>push.log 2>&1; then ok=1; break; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            # make the failure visible without the Actions log: a comment on the newest open issue labelled "health"
            body=$(tail -c 1500 push.log | python3 -c 'import json,sys;print(json.dumps({"body":"Prepare could not save its work:\n```\n"+sys.stdin.read()+"\n```"}))')
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues?labels=health&state=open&per_page=1" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["number"] if d else "")')
            if [ -n "$n" ]; then curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$n/comments" -d "$body"
            else curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" -d "$(echo "$body" | python3 -c 'import json,sys;d=json.load(sys.stdin);d.update(title="Prepare could not save",labels=["health"]);print(json.dumps(d))')"; fi
            cat push.log; exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    needs: prepare
    if: (needs.prepare.outputs.published != '0' && needs.prepare.outputs.published != '') || needs.prepare.outputs.site == '1'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
