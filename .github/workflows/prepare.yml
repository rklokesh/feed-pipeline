name: Prepare notices for review

# After each watch run: AI turns new raw notices into clean cards and publishes them (a closed issue is kept as the record).
on:
  workflow_run:
    workflows: ["Watch official sources", "Watch India-only sources"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # save cards into data/
  issues: write     # open review issues

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  prepare:
    # after a Mac check, prepare on the Mac too (free minutes); after the GitHub backup check, on GitHub
    runs-on: ${{ github.event.workflow_run.name == 'Watch India-only sources' && fromJSON('["self-hosted","india"]') || 'ubuntu-latest' }}
    timeout-minutes: 50
    outputs:
      published: ${{ steps.cards.outputs.published }}
      site: ${{ steps.save.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: runner.os != 'macOS'
      - name: Use the Mac's Python (set up by the India watcher)
        if: runner.os == 'macOS'
        run: echo "$HOME/.sarkarichart-venv/bin" >> "$GITHUB_PATH"
      - name: Prepare cards and auto-publish
        id: cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/prepare.py
      - name: Write notice pages (new ones + a few older pages upgraded to the full layout each run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/exams.py tag && python scripts/pages.py && python scripts/exams.py build
      - name: Rebuild homepage list
        run: python scripts/publish.py build && python scripts/report_page.py && python scripts/info_pages.py && python scripts/seo_files.py
      - name: Save
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Prepare: cards + auto-publish $(date -u +%Y-%m-%dT%H:%MZ)"
          if git diff --name-only HEAD~1 | grep -q '^site/'; then echo "site=1" >> "$GITHUB_OUTPUT"; fi
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
  deploy:
    needs: prepare
    if: (needs.prepare.outputs.published != '0' && needs.prepare.outputs.published != '') || needs.prepare.outputs.site == '1'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
