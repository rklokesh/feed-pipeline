name: Post to Telegram

# After every site deploy: post newly published notices to t.me/sarkarichart (with their share image).
on:
  workflow_run:
    workflows: ["Deploy site", "Prepare notices for review", "Publish approved notices"]
    types: [completed]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message only (true/false)"
        default: "false"
      facebook_status:
        description: "Facebook only: check the page token, post nothing (true/false)"
        default: "false"
      facebook_test:
        description: "Facebook only: post one sample notice (true/false)"
        default: "false"
      whatsapp_status:
        description: "WhatsApp only: check the Whapi connection, post nothing (true/false)"
        default: "false"
      whatsapp_test:
        description: "WhatsApp only: send the newest open job notice once as a sample post (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Wait for the new pages and images to be live
        if: github.event_name == 'workflow_run'
        run: sleep 45
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        if: inputs.whatsapp_test != 'true' && inputs.whatsapp_status != 'true' && inputs.facebook_test != 'true' && inputs.facebook_status != 'true'
        run: python scripts/telegram.py ${{ inputs.test == 'true' && '--test' || '' }}
      - name: Post to Facebook page
        continue-on-error: true   # Facebook trouble must never stop the others
        if: inputs.whatsapp_test != 'true' && inputs.whatsapp_status != 'true'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/facebook.py ${{ inputs.facebook_status == 'true' && '--status' || '' }} ${{ inputs.facebook_test == 'true' && '--test' || '' }}
      - name: Post to WhatsApp channel
        if: inputs.facebook_test != 'true' && inputs.facebook_status != 'true'
        continue-on-error: true   # WhatsApp trouble must never stop Telegram
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
        run: python scripts/whatsapp.py ${{ inputs.whatsapp_status == 'true' && '--status' || '' }} ${{ inputs.whatsapp_test == 'true' && '--test' || '' }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram.json 2>/dev/null || true
          git add reports/telegram.txt 2>/dev/null || true
          git add data/whatsapp.json reports/whatsapp.txt data/facebook.json reports/facebook.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Telegram/WhatsApp: posted $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 6; done
