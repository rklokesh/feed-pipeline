name: Post to Telegram

# After every site deploy: post newly published notices to t.me/sarkarichart (with their share image).
on:
  workflow_run:
    workflows: ["Deploy site", "Prepare notices for review", "Publish approved notices"]
    types: [completed]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message only (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Wait for the new pages and images to be live
        if: github.event_name == 'workflow_run'
        run: sleep 45
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram.py ${{ inputs.test == 'true' && '--test' || '' }}
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram.json 2>/dev/null || true
          git add reports/telegram.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Telegram: posted $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 6; done
