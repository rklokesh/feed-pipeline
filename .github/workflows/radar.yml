name: Coverage radar

# Daily ~07:31 IST, before the health report: which boards appear on a big aggregator's headlines that we don't watch?
# Reads headlines only (robots.txt respected); nothing is ever published from it.
on:
  schedule:
    - cron: "1 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/radar.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.json
          git diff --cached --quiet && exit 0
          git commit -m "Radar $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
