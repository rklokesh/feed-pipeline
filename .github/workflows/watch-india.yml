name: Watch India-only sources

# Same as "Watch official sources", but for boards that block foreign servers (UPSC, RRB, defence,
# paramilitary, Employment News, state commissions). Runs on the owner's Mac mini (self-hosted runner,
# label `india`), so it costs no GitHub minutes. If the Mac is off, the run simply waits in the queue.
# A timer on the Mac (Sarkari Chart/setup-timer.sh) starts this every 30 minutes; the cron below is the backup.
on:
  schedule:
    - cron: "45 0-17 * * *"     # hourly, 06:15-23:15 IST
    - cron: "45 20,23 * * *"    # plus 02:15 and 05:15 IST
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: comma-separated source ids"
        default: ""

permissions:
  contents: write

concurrency:
  group: watch-data   # shared with watch.yml: never two watchers writing data at once
  cancel-in-progress: false

jobs:
  watch:
    runs-on: [self-hosted, india]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Python 3.12 via uv (setup-python's macOS builds don't work on self-hosted Macs). Kept in the runner's home.
      - name: Python 3.12 + packages
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | sh
          V="$HOME/.sarkarichart-venv"
          [ -x "$V/bin/python" ] || uv venv --python 3.12 "$V"
          uv pip install -q --python "$V/bin/python" -r requirements.txt
          "$V/bin/python" -m playwright install chromium
          echo "$V/bin" >> "$GITHUB_PATH"
      - name: Watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASELINE_SAMPLE: "2"   # first look at a new board: remember everything, send only the 2 newest for review
        run: |
          # The Mac checks EVERY board (India-only ones and the ones GitHub can also reach): it is free and reliable.
          ONLY=""; if [ -n "${{ inputs.only }}" ]; then ONLY="--only ${{ inputs.only }}"; fi
          python scripts/watch.py --runner india $ONLY
          python scripts/watch.py --runner github $ONLY
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Watch (India): new data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 8; done
