name: Set up view counter + report form (re-runnable)

# Creates the free Cloudflare D1 database for notice view counts and writes its id into wrangler.toml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REPORT_GH_TOKEN: ${{ secrets.REPORT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create database + table
        run: |
          set +e
          mkdir -p reports
          OUT=reports/views-setup.txt
          echo "# view counter setup $(date -u)" > $OUT
          npx --yes wrangler@3 d1 list --json > /tmp/list.json 2>>$OUT
          ID=$(node -e 'try{const l=require("/tmp/list.json");const d=l.find(x=>x.name==="sarkarichart-views");console.log(d?d.uuid:"")}catch(e){console.log("")}')
          if [ -z "$ID" ]; then
            npx --yes wrangler@3 d1 create sarkarichart-views >> $OUT 2>&1
            npx --yes wrangler@3 d1 list --json > /tmp/list.json 2>>$OUT
            ID=$(node -e 'try{const l=require("/tmp/list.json");const d=l.find(x=>x.name==="sarkarichart-views");console.log(d?d.uuid:"")}catch(e){console.log("")}')
          fi
          echo "database_id: ${ID:-NONE}" >> $OUT
          if [ -n "$ID" ]; then
            npx --yes wrangler@3 d1 execute sarkarichart-views --remote --command "CREATE TABLE IF NOT EXISTS views (slug TEXT PRIMARY KEY, n INTEGER NOT NULL DEFAULT 0)" >> $OUT 2>&1
            npx --yes wrangler@3 d1 execute sarkarichart-views --remote --command "CREATE TABLE IF NOT EXISTS report_rl (ip TEXT, ts INTEGER); CREATE INDEX IF NOT EXISTS report_rl_ip ON report_rl (ip, ts); CREATE TABLE IF NOT EXISTS report_img (id TEXT PRIMARY KEY, data TEXT, ts INTEGER)" >> $OUT 2>&1
            if [ -n "$REPORT_GH_TOKEN" ]; then
              printf '%s' "$REPORT_GH_TOKEN" | npx --yes wrangler@3 pages secret put GH_TOKEN --project-name sarkarichart >> $OUT 2>&1 && echo "GH_TOKEN secret set" >> $OUT
            else
              echo "REPORT_GH_TOKEN secret missing in GitHub" >> $OUT
            fi
            printf 'name = "sarkarichart"\npages_build_output_dir = "site"\ncompatibility_date = "2026-10-01"\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "sarkarichart-views"\ndatabase_id = "%s"\n' "$ID" > wrangler.toml
          fi
          sed -i "s/${CLOUDFLARE_ACCOUNT_ID}/<account>/g" $OUT
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/views-setup.txt wrangler.toml 2>/dev/null || git add reports/views-setup.txt
          git commit -m "View counter setup" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
