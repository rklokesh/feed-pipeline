name: Publish approved notices

# You add the "approve" or "reject" label to a review issue -> this records the decision,
# rebuilds the homepage list and deploys the site.
on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approve' || github.event.label.name == 'reject'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Record decision
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish.py decide ${{ github.event.issue.number }} ${{ github.event.label.name }}
      - name: Rebuild homepage list
        run: python scripts/publish.py build
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/index.html
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Publish: ${{ github.event.label.name || 'rebuild' }} #${{ github.event.issue.number }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
  deploy:
    needs: decide
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
