name: Publish approved notices

# Notices go live automatically (prepare.yml). You add "reject" to take one down, or "approve" after commenting a fix -> this records the decision, writes a clean
# notice page for each approved notice (AI reads the official PDF + your comments), rebuilds the homepage and deploys.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      rebuild_pages:
        description: "Rewrite every notice page (re-reads your comments)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  decide:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approve' || github.event.label.name == 'reject'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record decisions (this one and any others labelled meanwhile)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the issue you just labelled (works on closed auto-published issues too), then any others
          if [ "${{ github.event_name }}" = "issues" ]; then
            python scripts/publish.py decide ${{ github.event.issue.number }} ${{ github.event.label.name }} || true
          fi
          python scripts/publish.py sweep
      - name: Write notice pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/pages.py ${{ inputs.rebuild_pages && '--all' || '' }}
      - name: Rebuild homepage list
        run: python scripts/publish.py build
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Publish: decisions and pages $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
  deploy:
    needs: decide
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
