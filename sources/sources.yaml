# Official recruitment notice boards to watch.
# Step 1 (probe) checks which of these load from GitHub's servers.
# URLs are best-known entry points; the probe report flags any that 404 or redirect.
# render: static = plain HTML fetch is enough; js = needs a headless browser.
# runner: github = reachable from GitHub's US servers (probe, Oct 2026);
#         india  = needs an Indian internet connection (Mac mini runner, later).

sources:
  # ---- Central: commissions & exam bodies ----
  - id: upsc-whats-new
    org: UPSC
    url: https://upsc.gov.in/whats-new
    render: static
    runner: india
  - id: upsc-active-exams
    org: UPSC
    url: https://upsc.gov.in/examinations/active-exams
    render: static
    runner: india
  - id: ssc-notice-board
    org: SSC
    url: https://ssc.gov.in/home/notice-board
    render: js
    attachment_prefix: https://ssc.gov.in/api/attachment/
    runner: github
  - id: ibps-home
    org: IBPS
    url: https://www.ibps.in/
    render: static
    runner: india          # GitHub's servers hit a TLS error here; the Mac reads it fine
    # each running exam cycle (CRP) has its own page; its notices/corrigenda are PDFs under wp-content/uploads
    follow: "ibps\\.in/index\\.php/(specialist-officers|rural-bank|regional-rural-bank|clerical-cadre|management-trainees|po-mt|clerks?)-[a-z]+/?$"
    follow_limit: 6
  - id: nta-home
    org: NTA
    url: https://nta.ac.in/
    render: static
    runner: github
  - id: rrb-cdg
    org: RRB Chandigarh
    url: https://rrbcdg.gov.in/
    render: static
    runner: india
  - id: rrb-unified
    org: RRB
    url: https://rrb.indianrailways.gov.in/
    render: js
    runner: india
    # each CEN (recruitment) has its own page per region; open one region page per CEN of this/last year
    follow: "getdata\\?cennum=\\d+/(2025|2026|2027)&loc=[a-z]+&status=1"
    follow_key: "cennum=\\d+/\\d+"
    follow_limit: 14
    download: browser   # files are only served inside a browser session

  # ---- Banks & financial ----
